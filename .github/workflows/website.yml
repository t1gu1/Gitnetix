name: Website

# Deploys website/ to GitHub Pages. The release workflow calls this after publishing,
# so the site picks up the new CHANGELOG.md section and download links on every release.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release pushes its commit to main together with its tag. Building on that main push
  # would link the previous release (the new one is still building), and Pages ignores a
  # second deployment of the same commit, so the release workflow's rebuild never shows up.
  # Leave tagged commits to the release workflow, which deploys once the release is published.
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.check.outputs.tagged }}
    steps:
      - id: check
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          if git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" | grep -q "^${GITHUB_SHA}[[:space:]]"; then
            echo "::notice::${GITHUB_SHA} is tagged, the release workflow deploys the website."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-tag
    if: needs.check-tag.outputs.tagged != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build
        env:
          # Reads the latest release tag without hitting the anonymous API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
