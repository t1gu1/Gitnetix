name: Rust cache

# A release runs on a tag, and a tag run can only restore the caches saved on that tag or on main. Nothing built on
# main, so every release compiled all of its dependencies from scratch. This workflow saves them on main for the
# release builds to restore. Keep its runners, targets, cache keys and build command in step with the build job in
# release.yml, or the keys stop matching and the releases go back to compiling everything.
on:
  push:
    branches:
      - main
    # The cache holds the dependencies only, so it goes stale only when they change.
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/rust-cache.yml"
  # A new stable Rust changes the cache key, and a cache unused for 7 days expires.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: rust-cache
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-22.04
          - name: macos
            runner: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            cmake \
            libclang-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The release compile, through the same CLI so cargo gets the same features and flags, without the bundles.
      - name: Build
        run: bun run tauri build --no-bundle ${{ matrix.target && format('--target {0}', matrix.target) }}
