name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tag push events carry no branch, so make sure the tagged commit is on main.
  check-main:
    runs-on: ubuntu-latest
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
      app: ${{ steps.app.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag ${GITHUB_REF_NAME} is not on main, skipping build."
            echo "on-main=false" >> "$GITHUB_OUTPUT"
          fi

      # A tag that changes only app-free paths since the latest published release ships no new app: skip the
      # builds and the release, the website job still deploys. Same paths as the paths-ignore list in ci.yml.
      - id: app
        if: steps.check.outputs.on-main == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" >/dev/null \
            && ! git diff --name-only "$last" "$GITHUB_SHA" | grep -qvE '^(website/|website_idea/|\.github/workflows/website\.yml$|[^/]+\.md$)'; then
            echo "::notice::Only the website changed since ${last}, skipping the app build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-main
    if: needs.check-main.outputs.on-main == 'true' && needs.check-main.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu keeps the AppImage's glibc requirement low.
          - name: linux
            runner: ubuntu-22.04
            bundles: appimage
          # One universal binary covers both Apple Silicon and Intel Macs.
          - name: macos
            runner: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            cmake \
            libclang-dev \
            patchelf \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad

      # bundleMediaFramework (tauri.conf.json) copies every plugin in GSTREAMER_PLUGINS_DIR into the AppImage: only the
      # ones WebKitGTK needs to play and decode WAV, MP3, OGG, Opus, FLAC and M4A, not the hundred the packages above install.
      - name: Pick the GStreamer plugins the AppImage bundles
        if: matrix.name == 'linux'
        run: |
          dir="$RUNNER_TEMP/gst-plugins"
          mkdir -p "$dir"
          for p in coreelements playback typefindfunctions app gio audioconvert audioresample volume autodetect pulseaudio \
            interleave wavparse audioparsers id3demux mpg123 ogg vorbis opus flac isomp4 faad; do
            cp "/usr/lib/x86_64-linux-gnu/gstreamer-1.0/libgst$p.so" "$dir/"
          done
          echo "GSTREAMER_PLUGINS_DIR=$dir" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Once is enough: a failure fails this job, so publish (which needs every build) never runs.
      - name: Run tests
        if: matrix.name == 'linux'
        run: cargo test --workspace

      - name: Build bundles
        env:
          # Signs the update bundles so installed apps accept them as updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the binary for "Sign in with Atlassian", Trello and Asana (see tickets/oauth.rs).
          GITNETIX_JIRA_CLIENT_ID: ${{ secrets.GITNETIX_JIRA_CLIENT_ID }}
          GITNETIX_JIRA_CLIENT_SECRET: ${{ secrets.GITNETIX_JIRA_CLIENT_SECRET }}
          GITNETIX_TRELLO_CLIENT_ID: ${{ secrets.GITNETIX_TRELLO_CLIENT_ID }}
          GITNETIX_TRELLO_CLIENT_SECRET: ${{ secrets.GITNETIX_TRELLO_CLIENT_SECRET }}
          GITNETIX_ASANA_CLIENT_ID: ${{ secrets.GITNETIX_ASANA_CLIENT_ID }}
          GITNETIX_ASANA_CLIENT_SECRET: ${{ secrets.GITNETIX_ASANA_CLIENT_SECRET }}
          # Baked into the binary for "Sign in with Bitbucket" (see providers/bitbucket.rs).
          GITNETIX_BITBUCKET_CLIENT_ID: ${{ secrets.GITNETIX_BITBUCKET_CLIENT_ID }}
          GITNETIX_BITBUCKET_CLIENT_SECRET: ${{ secrets.GITNETIX_BITBUCKET_CLIENT_SECRET }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS=(--bundles "${{ matrix.bundles }}" --config "{\"version\":\"${VERSION}\"}")
          if [ -n "${{ matrix.target }}" ]; then
            ARGS+=(--target "${{ matrix.target }}")
          fi
          pnpm tauri build "${ARGS[@]}"

      # Gather the release files in one flat folder so the publish job can
      # tell the platforms apart by file name alone.
      - name: Collect release files
        run: |
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          mkdir -p release
          case "${{ matrix.name }}" in
            linux)
              cp "$BUNDLE_DIR"/appimage/*.AppImage "$BUNDLE_DIR"/appimage/*.AppImage.sig release/
              ;;
            macos)
              cp "$BUNDLE_DIR"/dmg/*.dmg release/
              # The updater bundle is named after the app only, so tag it with the arch.
              for f in "$BUNDLE_DIR"/macos/*.app.tar.gz "$BUNDLE_DIR"/macos/*.app.tar.gz.sig; do
                name=$(basename "$f")
                cp "$f" "release/${name/.app.tar.gz/_universal.app.tar.gz}"
              done
              ;;
            windows)
              cp "$BUNDLE_DIR"/nsis/*-setup.exe "$BUNDLE_DIR"/nsis/*-setup.exe.sig release/
              ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: gitnetix-${{ matrix.name }}-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The release notes are this version's CHANGELOG.md section, without its heading,
      # or the Unreleased section when the tag was pushed without dating the changelog.
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          section() {
            awk -v name="$1" '
              /^## \[/ { if (found) exit; if (index(tolower($0), "## [" tolower(name) "]") == 1) { found = 1; next } }
              found
            ' CHANGELOG.md | sed -e '/./,$!d'
          }
          section "$VERSION" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            section Unreleased > release-notes.md
            if grep -q '[^[:space:]]' release-notes.md; then
              echo "::notice::No CHANGELOG.md section for ${VERSION}, using Unreleased."
            else
              echo "::warning::No CHANGELOG.md entries for ${VERSION}, release notes only list commits."
            fi
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v8
        with:
          pattern: gitnetix-*-${{ github.ref_name }}
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: release-notes.md
          # Appends the merged PRs and full diff link below the changelog section.
          generate_release_notes: true

      # The updater feed installed apps poll via releases/latest/download/latest.json.
      - name: Publish updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          platform() {
            local file
            file=$(ls release/$1)
            jq -n --arg signature "$(cat "$file.sig")" --arg url "${BASE_URL}/$(basename "$file")" \
              '{signature: $signature, url: $url}'
          }
          LINUX=$(platform '*.AppImage')
          MACOS=$(platform '*.app.tar.gz')
          WINDOWS=$(platform '*-setup.exe')
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson linux "$LINUX" \
            --argjson macos "$MACOS" \
            --argjson windows "$WINDOWS" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {
                "linux-x86_64": $linux,
                "darwin-aarch64": $macos,
                "darwin-x86_64": $macos,
                "windows-x86_64": $windows
              }}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  # Rebuild the website with this release's changelog and download links. A website-only tag skips
  # publish but still deploys, its download links staying on the latest published release.
  website:
    needs: [check-main, publish]
    if: ${{ !cancelled() && needs.check-main.outputs.on-main == 'true' && (needs.publish.result == 'success' || needs.check-main.outputs.app == 'false') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      released: ${{ needs.publish.result == 'success' }}
