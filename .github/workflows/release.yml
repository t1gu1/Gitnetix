name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tag push events carry no branch, so make sure the tagged commit is on main.
  check-main:
    runs-on: ubuntu-latest
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag ${GITHUB_REF_NAME} is not on main, skipping build."
            echo "on-main=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-main
    if: needs.check-main.outputs.on-main == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu keeps the AppImage's glibc requirement low.
          - name: linux
            runner: ubuntu-22.04
            bundles: appimage
          # One universal binary covers both Apple Silicon and Intel Macs.
          - name: macos
            runner: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        env:
          # Signs the update bundles so installed apps accept them as updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS=(--bundles "${{ matrix.bundles }}" --config "{\"version\":\"${VERSION}\"}")
          if [ -n "${{ matrix.target }}" ]; then
            ARGS+=(--target "${{ matrix.target }}")
          fi
          pnpm tauri build "${ARGS[@]}"

      # Gather the release files in one flat folder so the publish job can
      # tell the platforms apart by file name alone.
      - name: Collect release files
        run: |
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          mkdir -p release
          case "${{ matrix.name }}" in
            linux)
              cp "$BUNDLE_DIR"/appimage/*.AppImage "$BUNDLE_DIR"/appimage/*.AppImage.sig release/
              ;;
            macos)
              cp "$BUNDLE_DIR"/dmg/*.dmg release/
              # The updater bundle is named after the app only, so tag it with the arch.
              for f in "$BUNDLE_DIR"/macos/*.app.tar.gz "$BUNDLE_DIR"/macos/*.app.tar.gz.sig; do
                name=$(basename "$f")
                cp "$f" "release/${name/.app.tar.gz/_universal.app.tar.gz}"
              done
              ;;
            windows)
              cp "$BUNDLE_DIR"/nsis/*-setup.exe "$BUNDLE_DIR"/nsis/*-setup.exe.sig release/
              ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: gitnetix-${{ matrix.name }}-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release notes are this version's CHANGELOG.md section, without its heading,
      # or the Unreleased section when the tag was pushed without dating the changelog.
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          section() {
            awk -v name="$1" '
              /^## \[/ { if (found) exit; if (index(tolower($0), "## [" tolower(name) "]") == 1) { found = 1; next } }
              found
            ' CHANGELOG.md | sed -e '/./,$!d'
          }
          section "$VERSION" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            section Unreleased > release-notes.md
            if grep -q '[^[:space:]]' release-notes.md; then
              echo "::notice::No CHANGELOG.md section for ${VERSION}, using Unreleased."
            else
              echo "::warning::No CHANGELOG.md entries for ${VERSION}, release notes only list commits."
            fi
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: gitnetix-*-${{ github.ref_name }}
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
          # Appends the merged PRs and full diff link below the changelog section.
          generate_release_notes: true

      # The updater feed installed apps poll via releases/latest/download/latest.json.
      - name: Publish updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          platform() {
            local file
            file=$(ls release/$1)
            jq -n --arg signature "$(cat "$file.sig")" --arg url "${BASE_URL}/$(basename "$file")" \
              '{signature: $signature, url: $url}'
          }
          LINUX=$(platform '*.AppImage')
          MACOS=$(platform '*.app.tar.gz')
          WINDOWS=$(platform '*-setup.exe')
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson linux "$LINUX" \
            --argjson macos "$MACOS" \
            --argjson windows "$WINDOWS" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {
                "linux-x86_64": $linux,
                "darwin-aarch64": $macos,
                "darwin-x86_64": $macos,
                "windows-x86_64": $windows
              }}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
