name: CI

# Runs on pull requests only: a branch push without a PR runs nothing. Releases test on their tag in release.yml.
# Website-only changes hold no app code to test: website.yml builds those. Keep this list in step
# with the app-free paths in release.yml.
on:
  pull_request:
    paths-ignore:
      - "website/**"
      - "website_idea/**"
      - ".github/workflows/website.yml"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            cmake \
            libclang-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: cargo test --workspace

  # Paths, line endings and spawned programs differ on Windows, which release builds ship.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Run tests
        run: cargo test --workspace
