[package]
name = "gitnetix"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Release-centric Git client with AI agents"

[lib]
name = "gitnetix_lib"
# Desktop only: staticlib and cdylib made every debug rebuild write a 1.5 GB .a and a 435 MB .so the desktop app never loads.
# Before `bun run ios` or `bun run android`, set this to ["staticlib", "cdylib", "rlib"]: the Tauri CLI refuses mobile without them.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The engine runs on desktop. The mobile build is a remote control that talks
# to a desktop (or headless) Gitnetix over the companion API.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gitnetix-core.workspace = true
gitnetix-server.workspace = true
tokio.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Voice dictation's microphone: webview recording depends on codecs each OS (and Linux distro) may lack.
cpal = "0.18"
# Copies chat images as files (the web clipboard holds still PNGs only, so GIFs would stop moving). Wayland when the compositor allows it, else X11.
# Also reads pasted images and copied files, which WebKitGTK never hands the page.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control", "image-data"] }
png = "0.18"
# A ticket's file comes to the window as a data: URL; Download saves its bytes.
base64 = "0.22"

# A picture of the claude.ai artifact window (artifact.rs), with each platform's webview: the versions wry pins.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
