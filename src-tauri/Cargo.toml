[package]
name = "gitnetix"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Release-centric Git client with AI agents"

[lib]
name = "gitnetix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The engine runs on desktop. The mobile build is a remote control that talks
# to a desktop (or headless) Gitnetix over the companion API.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gitnetix-core.workspace = true
gitnetix-server.workspace = true
tokio.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Voice dictation's microphone: webview recording depends on codecs each OS (and Linux distro) may lack.
cpal = "0.18"
# Copies chat images as files (the web clipboard holds still PNGs only, so GIFs would stop moving). Wayland when the compositor allows it, else X11.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
