[package]
name = "gitnetix-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Git, release flow, AI and integrations engine behind Gitnetix"

[features]
default = ["keychain"]
# OS keychain for API keys and tokens. Disabled on platforms without one.
keychain = ["dep:keyring"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
regex.workspace = true
tracing.workspace = true
futures-util.workspace = true
base64 = "0.22"
notify = "8"
portable-pty = "0.9"
# Canonical paths without the `\\?\` prefix on Windows, which cmd.exe refuses as a working folder.
dunce = "1"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }
# Voice dictation: speech to text on this computer, from the desktop microphone or what a browser records.
transcribe-cpp = { version = "0.4.1", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["mkv", "ogg", "vorbis", "pcm", "isomp4", "aac"] }
sha2 = "0.10"
# GitLab names a diff line by the SHA-1 of its file's path, which a comment on several lines must give.
sha1 = "0.10"
# The Gitnetix account's end-to-end encryption (vault.rs): sealed boxes for keys, XChaCha20-Poly1305 for items.
crypto_box = { version = "0.9", features = ["seal"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
# Backups (backup.rs) go out compressed; already in the build through other crates.
flate2 = "1"
# Live updates (live.rs): this computer's socket on the Gitnetix relay, over the rustls reqwest already uses.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Phones from anywhere (phone.rs) use the end-to-end encrypted channel the phone app shares.
gitnetix-relay.workspace = true

# Speech to text on the GPU through Metal on Apple Silicon; Intel Macs stay on the CPU, as ggml's Metal backend targets Apple GPUs.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["metal"] }

# Agents run below the app's CPU priority (shell::below_app).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Finds the Store ChatGPT app's codex.exe (ai::store_codex). Already built for reqwest.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
tempfile = "3"
