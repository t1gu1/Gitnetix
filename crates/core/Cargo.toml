[package]
name = "gitnetix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Git, release flow, AI and integrations engine behind Gitnetix"

[features]
default = ["keychain"]
# OS keychain for API keys and tokens. Disabled on platforms without one.
keychain = ["dep:keyring"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
regex.workspace = true
tracing.workspace = true
futures-util.workspace = true
base64 = "0.22"
notify = "8"
portable-pty = "0.9"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }
# Voice dictation: speech to text on this computer, from the desktop microphone or what a browser records.
transcribe-cpp = { version = "0.4.1", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["mkv", "ogg", "vorbis", "pcm", "isomp4", "aac"] }
sha2 = "0.10"

# Speech to text on the GPU through Metal on Apple Silicon; Intel Macs stay on the CPU, as ggml's Metal backend targets Apple GPUs.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
