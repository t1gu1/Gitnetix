  <line x1="660" y1="404" x2="1120" y2="404" stroke="#272a30"/>
  <text x="664" y="428" fill="#7a808a" font-size="11" letter-spacing="1.2">SHIPPED</text>
  <text x="694" y="458" fill="#a0a5ae" font-size="14">release/2.3.0</text>
  <rect x="800" y="445" width="52" height="18" rx="9" fill="#24282e"/><text x="826" y="458" fill="#c4a7ff" font-size="11" text-anchor="middle">v2.3.0</text>
  <text x="694" y="486" fill="#7a808a" font-size="13">release/2.2.0</text>
  <text x="640" y="536" fill="#a0a5ae" font-size="14">Where you are, what ships next, what's done. At a glance.</text>
