<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tint" x1="0" x2="1">
      <stop offset="0" stop-color="#f0a43a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f0a43a" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="bgglow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#2a2013"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </radialGradient>
  </defs>

  <rect width="960" height="600" fill="url(#bgglow)"/>

  <!-- window -->
  <rect x="40" y="36" width="880" height="528" rx="14" fill="#15171a" stroke="#272a30"/>
  <path d="M40 50a14 14 0 0 1 14-14h852a14 14 0 0 1 14 14v26H40z" fill="#1c1f23"/>
  <circle cx="64" cy="56" r="6" fill="#ff5f57"/><circle cx="84" cy="56" r="6" fill="#febc2e"/><circle cx="104" cy="56" r="6" fill="#28c840"/>
  <text x="480" y="61" fill="#a0a5ae" font-size="13" text-anchor="middle">Gitnetix — acme-web</text>
  <line x1="40" y1="76" x2="920" y2="76" stroke="#272a30"/>
  <line x1="500" y1="76" x2="500" y2="564" stroke="#272a30"/>

  <!-- tree header -->
  <text x="64" y="104" fill="#7a808a" font-size="11" letter-spacing="1.2">BRANCHES</text>

  <!-- rails (dim) -->
  <g stroke="#3a3e46" stroke-width="2" fill="none">
    <path d="M70 136 V378"/>
    <path d="M70 290 H90"/><path d="M70 378 H90"/>
    <path d="M98 158 V246"/><path d="M98 246 H118"/>
    <path d="M98 312 V334 H118"/>
  </g>

  <!-- orange path: main -> release/0.5.0 -> feat/tree-pulse -->
  <g stroke="#f7c48a" stroke-width="2.5" fill="none" filter="url(#glow)">
    <path d="M70 136 V158 H90"/>
    <path d="M98 168 V202 H118"/>
  </g>
  <!-- path pulse -->
  <circle cx="98" cy="186" r="4" fill="#fff3dd" filter="url(#glow)"/>

  <!-- main -->
  <circle cx="70" cy="124" r="7" fill="none" stroke="#f7c48a" stroke-width="2.2"/>
  <text x="88" y="129" fill="#e8e9eb" font-size="15" font-weight="600">main</text>
  <text x="132" y="129" fill="#7a808a" font-size="12">default · up to date</text>

  <!-- release/0.5.0 -->
  <rect x="91" y="152" width="14" height="14" rx="3" fill="none" stroke="#c4a7ff" stroke-width="2"/>
  <text x="114" y="164" fill="#c4a7ff" font-size="14.5" font-weight="600">release/0.5.0</text>
  <text x="226" y="164" fill="#62d6ae" font-size="12">↑12</text>
  <text x="256" y="164" fill="#7a808a" font-size="12">open · 2 active · <tspan fill="#62d6ae">✓ 4 merged</tspan></text>

  <!-- checked out row -->
  <rect x="112" y="186" width="372" height="34" rx="7" fill="url(#tint)" stroke="#f0a43a" stroke-opacity="0.35"/>
  <circle cx="126" cy="202" r="5.5" fill="#f0a43a"/>
  <text x="140" y="200" fill="#e8e9eb" font-size="14" font-weight="600">feat/branch-tree</text>
  <text x="140" y="214" fill="#a0a5ae" font-size="11">from release/0.5.0 · <tspan fill="#62d6ae">↑4</tspan> · 2 WIP</text>
  <rect x="392" y="194" width="80" height="18" rx="9" fill="#24282e"/>
  <circle cx="404" cy="203" r="3.5" fill="#62d6ae"/>
  <text x="412" y="207" fill="#62d6ae" font-size="10.5">agent · live</text>

  <!-- fix/stale-info -->
  <circle cx="126" cy="246" r="5" fill="none" stroke="#86aeff" stroke-width="2"/>
  <text x="140" y="244" fill="#e8e9eb" font-size="14">fix/stale-remote</text>
  <text x="140" y="258" fill="#7a808a" font-size="11"><tspan fill="#62d6ae">↑1</tspan> <tspan fill="#e3b45a">↓2</tspan> · worktree</text>

  <!-- merged group under release -->

  <!-- release/0.4.1 -->
  <rect x="91" y="283" width="14" height="14" rx="3" fill="none" stroke="#c4a7ff" stroke-width="2"/>
  <text x="114" y="295" fill="#c4a7ff" font-size="14.5" font-weight="600" transform="translate(0,0)">release/0.4.1</text>
  <text x="226" y="295" fill="#7a808a" font-size="12">hotfix · from v0.4.0</text>
  <circle cx="126" cy="334" r="5" fill="none" stroke="#86aeff" stroke-width="2"/>
  <text x="140" y="332" fill="#e8e9eb" font-size="14">fix/tag-reopen</text>
  <text x="140" y="346" fill="#7a808a" font-size="11"><tspan fill="#62d6ae">↑2</tspan> · PR #182 open</text>

  <!-- falling behind -->
  <circle cx="98" cy="378" r="5" fill="none" stroke="#e3b45a" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="114" y="383" fill="#e3b45a" font-size="13">Falling behind (3)</text>
  <text x="240" y="383" fill="#7a808a" font-size="12">far behind main · clean up</text>

  <!-- shipped -->
  <line x1="64" y1="420" x2="484" y2="420" stroke="#272a30"/>
  <text x="64" y="444" fill="#7a808a" font-size="11" letter-spacing="1.2">SHIPPED</text>
  <rect x="91" y="471" width="14" height="14" rx="3" fill="#c4a7ff" fill-opacity="0.25" stroke="#c4a7ff" stroke-opacity="0.5" stroke-width="2"/>
  <text x="114" y="483" fill="#a0a5ae" font-size="14">release/0.4.0</text>
  <rect x="214" y="470" width="50" height="18" rx="9" fill="#24282e"/>
  <text x="239" y="483" fill="#c4a7ff" font-size="11" text-anchor="middle">v0.4.0</text>
  <text x="114" y="515" fill="#7a808a" font-size="13">release/0.3.0</text>
  <rect x="214" y="502" width="50" height="18" rx="9" fill="#1c1f23"/>
  <text x="239" y="515" fill="#7a808a" font-size="11" text-anchor="middle">v0.3.0</text>

  <!-- right pane: commits + agent -->
  <text x="524" y="104" fill="#7a808a" font-size="11" letter-spacing="1.2">FEAT/BRANCH-TREE · 4 COMMITS</text>
  <g font-size="13">
    <rect x="520" y="118" width="376" height="44" rx="8" fill="#24282e"/>
    <text x="536" y="137" fill="#e8e9eb">Draw orange path to checked-out row</text>
    <text x="536" y="153" fill="#7a808a" font-size="11">2 min ago · AI message</text>
    <text x="536" y="185" fill="#a0a5ae">Dim rows the path only passes by</text>
    <text x="536" y="201" fill="#7a808a" font-size="11">18 min ago</text>
    <text x="536" y="229" fill="#a0a5ae">Group merged branches under parent</text>
    <text x="536" y="245" fill="#7a808a" font-size="11">1 h ago</text>
  </g>
  <line x1="500" y1="270" x2="920" y2="270" stroke="#272a30"/>
  <text x="524" y="296" fill="#7a808a" font-size="11" letter-spacing="1.2">AGENT · CLAUDE CODE</text>
  <rect x="520" y="310" width="376" height="200" rx="10" fill="#0b0c0e" stroke="#272a30"/>
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="12">
    <text x="536" y="336" fill="#7a808a">› add a pulse that travels down the path</text>
    <text x="536" y="362" fill="#62d6ae">✓ edited BranchTree.tsx (+42 −6)</text>
    <text x="536" y="384" fill="#62d6ae">✓ edited app.css (+18)</text>
    <text x="536" y="406" fill="#a0a5ae">  running pnpm test …</text>
    <text x="536" y="428" fill="#62d6ae">✓ 128 passed</text>
    <text x="536" y="458" fill="#f5b65c">Commit with message:</text>
    <text x="536" y="478" fill="#e8e9eb">"Pulse along branch path"?</text>
  </g>
  <rect x="520" y="522" width="120" height="30" rx="8" fill="#f0a43a"/>
  <text x="580" y="542" fill="#1b1205" font-size="13" font-weight="600" text-anchor="middle">Commit &amp; push</text>
  <rect x="650" y="522" width="70" height="30" rx="8" fill="#24282e"/>
  <text x="685" y="542" fill="#e8e9eb" font-size="13" text-anchor="middle">Ship</text>
</svg>
