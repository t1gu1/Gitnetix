<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#f0a43a"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#0e0f11"/>
  <text x="600" y="58" fill="#e8e9eb" font-size="28" font-weight="600" text-anchor="middle">Cut. Build. Ship.</text>
  <text x="600" y="88" fill="#7a808a" font-size="15" text-anchor="middle">The release flow your team already runs, as buttons.</text>

  <g fill="none" stroke="#f0a43a" stroke-width="2.5" marker-end="url(#arr)">
    <path d="M300 230 H372"/><path d="M600 230 H672"/><path d="M900 230 H972"/>
  </g>

  <!-- step cards -->
  <g>
    <rect x="60" y="130" width="230" height="200" rx="16" fill="#15171a" stroke="#272a30"/>
    <circle cx="100" cy="172" r="18" fill="#c4a7ff" fill-opacity="0.15" stroke="#c4a7ff" stroke-width="2"/>
    <text x="100" y="178" fill="#c4a7ff" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="84" y="226" fill="#e8e9eb" font-size="20" font-weight="600">Cut a release</text>
    <text x="84" y="254" fill="#a0a5ae" font-size="13">release/2.4.0 from main,</text>
    <text x="84" y="274" fill="#a0a5ae" font-size="13">or from the last tag</text>
    <text x="84" y="294" fill="#a0a5ae" font-size="13">for a hotfix.</text>
  </g>
  <g>
    <rect x="380" y="130" width="210" height="200" rx="16" fill="#15171a" stroke="#272a30"/>
    <circle cx="420" cy="172" r="18" fill="#86aeff" fill-opacity="0.15" stroke="#86aeff" stroke-width="2"/>
    <text x="420" y="178" fill="#86aeff" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="404" y="226" fill="#e8e9eb" font-size="20" font-weight="600">Branch work</text>
    <text x="404" y="254" fill="#a0a5ae" font-size="13">Features and fixes</text>
    <text x="404" y="274" fill="#a0a5ae" font-size="13">off the release, each in</text>
    <text x="404" y="294" fill="#a0a5ae" font-size="13">its own worktree.</text>
  </g>
  <g>
    <rect x="680" y="130" width="210" height="200" rx="16" fill="#15171a" stroke="#272a30"/>
    <circle cx="720" cy="172" r="18" fill="#62d6ae" fill-opacity="0.15" stroke="#62d6ae" stroke-width="2"/>
    <text x="720" y="178" fill="#62d6ae" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="704" y="226" fill="#e8e9eb" font-size="20" font-weight="600">Agents help</text>
    <text x="704" y="254" fill="#a0a5ae" font-size="13">Claude, Codex, Gemini</text>
    <text x="704" y="274" fill="#a0a5ae" font-size="13">work in parallel. AI</text>
    <text x="704" y="294" fill="#a0a5ae" font-size="13">writes commits and PRs.</text>
  </g>
  <g>
    <rect x="980" y="130" width="170" height="200" rx="16" fill="#1f1708" stroke="#f0a43a" stroke-opacity="0.6" filter="url(#glow)"/>
    <circle cx="1020" cy="172" r="18" fill="#f0a43a"/>
    <text x="1020" y="178" fill="#1b1205" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text x="1004" y="226" fill="#f5b65c" font-size="20" font-weight="600">Ship</text>
    <text x="1004" y="254" fill="#a0a5ae" font-size="13">Date changelog,</text>
    <text x="1004" y="274" fill="#a0a5ae" font-size="13">ff main, tag v2.4.0,</text>
    <text x="1004" y="294" fill="#a0a5ae" font-size="13">push. One click.</text>
  </g>
  <text x="600" y="382" fill="#7a808a" font-size="13" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace">release/2.4.0  →  CHANGELOG [2.4.0] - 2026-10-22  →  main  →  v2.4.0</text>
</svg>
