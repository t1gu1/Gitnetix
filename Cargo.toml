[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
regex = "1"
tracing = "0.1"
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gitnetix-core = { path = "crates/core" }
gitnetix-server = { path = "crates/server" }

# Debug builds keep file and line for this workspace's code (panics, backtraces) and no debug info for dependencies: the
# desktop binary drops from 531 MB to 128 MB and a rebuild after a gitnetix-core edit from 6.1 s to 4.1 s. A debugger can no
# longer show variables; set `debug = true` here for a session that needs one.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
